<!--
* Created by Srvraj311 (Sourabh)
* sourabhraj311@gmail.com
*
* This View contains
1. Translucent navigation bar and a top progress bar for network activity
2. Booking panel on one side and the coach seat map on the other
3. Toast notifications
-->
<app-background></app-background>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gFree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34c759" stop-opacity="0.4" />
      <stop offset="1" stop-color="#34c759" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="gTaken" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4d" />
      <stop offset="1" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="gMine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ac8fa" />
      <stop offset="1" stop-color="#5e5ce6" />
    </linearGradient>
  </defs>
</svg>
<ng-container *ngIf="state$ | async as s">
  <div class="progress" *ngIf="s.trainsLoading || s.coachesLoading || s.mapLoading || s.busy" role="progressbar" aria-label="Loading"></div>

  <header class="nav">
    <div class="nav-inner">
      <svg class="logo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="3" width="14" height="14" rx="3" />
        <path d="M5 11h14M9 20l-2 2M15 20l2 2M9 14h.01M15 14h.01" />
      </svg>
      <span class="brand">Seat Allocation</span>
      <span class="tag">Nearest seats, together.</span>
      <button class="theme" type="button" (click)="toggleTheme()" [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'" [attr.title]="theme === 'dark' ? 'Light mode' : 'Dark mode'">
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" />
        </svg>
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <app-hero3d class="hero3d"></app-hero3d>
      <h1>Book seats that<br class="br" /> sit together.</h1>
      <p>Choose how many seats you need. We keep your group in one row and as close as possible.</p>
    </section>

    <div class="layout">
      <app-booking class="side"></app-booking>
      <app-seat class="map"></app-seat>
    </div>
  </main>

  <footer class="foot">
    <span>&copy; 2026 Seat Allocation</span>
    <span class="sep">·</span>
    <span>Built by <a href="https://github.com/srvraj311" target="_blank" rel="noopener">&#64;srvraj311</a></span>
    <span class="sep">·</span>
    <a href="https://srvraj311.vercel.app" target="_blank" rel="noopener">srvraj311.vercel.app</a>
  </footer>
</ng-container>

<div class="toasts" aria-live="polite">
  <div *ngFor="let t of toasts$ | async" class="toast" [ngClass]="t.kind" role="status" (click)="dismiss(t.id)">
    <span class="dot"></span>{{ t.text }}
  </div>
</div>
