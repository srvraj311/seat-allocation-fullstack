<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Seat Allocation System</title>
  <meta name="description" content="A train seat allocation system that books groups of up to 7 passengers in the same row, or as near each other as possible. Built with Angular, Express and MongoDB.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <script>
    // Dark by default; a saved choice wins. Runs before first paint to avoid a flash.
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === "dark" ? "#000000" : "#f5f5f7";
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <noscript>This app needs JavaScript to run.</noscript>
</body>
</html>
